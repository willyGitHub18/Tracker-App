<div id="tracker" class="section-panel active">
  <div class="tabs">
    <button class="tab-btn active" onclick="showTracker('saisie')">Saisie semaine</button>
    <button class="tab-btn" onclick="showTracker('progression')">Progression</button>
    <button class="tab-btn" onclick="showTracker('historique')">Historique</button>
  </div>

  <div class="data-toolbar">
    <span class="data-toolbar-label">Données</span>
    <button class="tool-btn export-json" onclick="exportJSON()">&#x2B07; Export JSON</button>
    <button class="tool-btn export-csv" onclick="exportCSV()">&#x2B07; Export CSV</button>
    <button class="tool-btn import-btn" onclick="document.getElementById('importFileInput').click()">&#x2B06; Importer</button>
    <input type="file" id="importFileInput" accept=".json" onchange="importJSON(event)">
    <span class="import-feedback" id="importFeedback">&#x2713; Import réussi</span>
  </div>

  <div id="t-saisie" class="tracker-panel active">
    <div class="week-bar">
      <label>Semaine</label>
      <select id="weekSel" onchange="renderSaisie()"></select>
      <span id="phaseBadge" class="phase-tag"></span>
    </div>
    <div id="saisieContent"></div>
  </div>

  <div id="t-progression" class="tracker-panel">
    <div id="progressionContent"></div>
  </div>

  <div id="t-historique" class="tracker-panel">
    <div id="historiqueContent"></div>
  </div>
</div>
