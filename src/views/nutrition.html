<div id="nutrition-section" class="section-panel">

  <!-- ── LISTE DES PLANS ── -->
  <div id="nutri-list-view" class="prog-view active-view">
    <div class="wiz-header">
      <div class="wiz-header-top">
        <div>
          <div class="wiz-header-title">Nutrition</div>
          <div class="wiz-header-sub">Ton plan de référence + tes plans personnalisés</div>
        </div>
        <button class="wiz-show-list-btn" onclick="showNutriWizard()">+ Créer un plan</button>
      </div>
    </div>
    <div id="nutriListContent"></div>
  </div>

  <!-- ── DÉTAIL D'UN PLAN ── -->
  <div id="nutri-detail-view" class="prog-view"></div>

  <!-- ── WIZARD NUTRITION ── -->
  <div id="nutri-wizard-view" class="prog-view">
    <div class="wiz-header">
      <div class="wiz-header-top">
        <div>
          <div class="wiz-header-title">Créer un plan nutrition</div>
          <div class="wiz-header-sub">Calcul de tes besoins (Mifflin-St Jeor)</div>
        </div>
        <button class="wiz-show-list-btn" onclick="showNutriList()">Mes plans →</button>
      </div>
    </div>
    <div id="nutriWizardContent"></div>
  </div>

  <!-- ── Plan ATHX legacy (référence statique, cloné dans le détail) ── -->
  <template id="athx-nutri-tpl">
    <div class="p-section">
      <div class="p-sec-title">Profil nutritionnel — 73 kg · 176 cm · athlète en phase de compétition</div>
      <div class="p-metrics">
        <div class="p-metric"><div class="p-metric-val">2 650</div><div class="p-metric-lbl">kcal/jour (entraînement)</div></div>
        <div class="p-metric"><div class="p-metric-val">2 250</div><div class="p-metric-lbl">kcal/jour (repos)</div></div>
        <div class="p-metric"><div class="p-metric-val">147 g</div><div class="p-metric-lbl">protéines/jour (2,0 g/kg)</div></div>
        <div class="p-metric"><div class="p-metric-val">23,6</div><div class="p-metric-lbl">IMC</div></div>
      </div>
      <div class="p-note">Calcul : MB Harris-Benedict (1846 kcal) × NAP 1,55 (actif modéré) = 2 861 kcal TDEE. En phase de construction musculaire légère (surplus 0–150 kcal les jours d'entraînement, déficit modéré les jours de repos). Macros basées sur la méta-analyse Morton et al. 2018 pour la force.</div>
    </div>
    <div class="p-section">
      <div class="p-sec-title">Répartition des macronutriments</div>
      <div class="p-card">
        <div class="p-card-body">
          <div style="display:flex;gap:16px;margin-bottom:10px;flex-wrap:wrap">
            <div><span style="font-size:18px;font-weight:500;color:var(--text)">147 g</span><div style="font-size:11px;color:var(--text2)">Protéines · 2,0 g/kg</div></div>
            <div><span style="font-size:18px;font-weight:500;color:var(--text)">310 g</span><div style="font-size:11px;color:var(--text2)">Glucides · ~4,2 g/kg</div></div>
            <div><span style="font-size:18px;font-weight:500;color:var(--text)">75 g</span><div style="font-size:11px;color:var(--text2)">Lipides · ~1,0 g/kg</div></div>
          </div>
          <div class="p-macro-bar"><div class="p-macro-p" style="width:22%"></div><div class="p-macro-g" style="width:47%"></div><div class="p-macro-l" style="width:26%"></div></div>
          <div class="p-macro-legend">
            <span><span class="p-legend-dot" style="background:#378ADD"></span>Protéines 22%</span>
            <span><span class="p-legend-dot" style="background:#1D9E75"></span>Glucides 47%</span>
            <span><span class="p-legend-dot" style="background:#EF9F27"></span>Lipides 26%</span>
          </div>
        </div>
      </div>
    </div>
    <div class="p-section">
      <div class="p-sec-title">Plan alimentaire — jour d'entraînement (midi)</div>
      <div class="p-card">
        <div class="p-meal-row"><div class="p-meal-time">7h00</div><div class="p-meal-name">Petit-déjeuner</div><div class="p-meal-detail">80 g flocons d'avoine + 200 ml lait demi-écrémé + 1 banane + 20 g whey ou 2 œufs brouillés. <strong style="color:var(--text)">~600 kcal · 35 g P · 85 g G · 12 g L</strong></div></div>
        <div class="p-meal-row"><div class="p-meal-time">10h30</div><div class="p-meal-name">Collation pré-entraînement</div><div class="p-meal-detail">1 banane + 30 g flocons d'avoine + 1 café. Ingérer 90 min avant la séance. <strong style="color:var(--text)">~280 kcal · 8 g P · 55 g G · 3 g L</strong></div></div>
        <div class="p-meal-row"><div class="p-meal-time">12h–14h</div><div class="p-meal-name">Séance (fenêtre training)</div><div class="p-meal-detail">500 ml eau + électrolytes si chaud. Optionnel : 1 gel glucidique pour séances MetCon &gt;50 min.</div></div>
        <div class="p-meal-row"><div class="p-meal-time">14h00</div><div class="p-meal-name">Repas post-entraînement ★</div><div class="p-meal-detail">200 g poulet/thon/œufs + 150 g riz cuit + légumes verts + 1 filet d'huile olive. Ingérer dans les 30–60 min post-séance. <strong style="color:var(--text)">~700 kcal · 45 g P · 75 g G · 15 g L</strong></div></div>
        <div class="p-meal-row"><div class="p-meal-time">17h30</div><div class="p-meal-name">Collation</div><div class="p-meal-detail">150 g yaourt grec 0% + 30 g noix + 1 fruit. <strong style="color:var(--text)">~320 kcal · 20 g P · 25 g G · 14 g L</strong></div></div>
        <div class="p-meal-row"><div class="p-meal-time">20h00</div><div class="p-meal-name">Dîner</div><div class="p-meal-detail">150 g saumon/viande rouge 1–2×/sem + 200 g patate douce ou pâtes + légumes. <strong style="color:var(--text)">~650 kcal · 38 g P · 70 g G · 18 g L</strong></div></div>
        <div class="p-meal-row"><div class="p-meal-time">21h30</div><div class="p-meal-name">Collation nocturne (opt.)</div><div class="p-meal-detail">20–30 g caséine (fromage blanc 0% + cannelle) pour synthèse protéique nocturne. <strong style="color:var(--text)">~120 kcal · 20 g P · 8 g G · 1 g L</strong></div></div>
      </div>
      <div class="p-note green">Total estimé jour entraînement : ~2 670 kcal · 166 g P · 318 g G · 63 g L. La veille des séances lourdes (mardi soir et jeudi soir) : augmenter les glucides de 50–80 g (portion de riz/pâtes supplémentaire).</div>
    </div>
    <div class="p-section">
      <div class="p-sec-title">Supplémentation — evidence-based uniquement</div>
      <div class="p-card">
        <div class="p-ex-row"><div class="p-ex-name">Créatine monohydrate</div><div class="p-ex-detail">5 g/jour, tous les jours, peu importe le timing. Seul supplément avec preuve solide sur la force et la puissance (méta-analyse Lanhers 2017). Pas de phase de charge nécessaire.</div><div class="p-ex-tag p-tag-f">Grade A</div></div>
        <div class="p-ex-row"><div class="p-ex-name">Whey protéine</div><div class="p-ex-detail">20–30 g post-séance si l'apport protéique alimentaire est insuffisant. Outil pratique, pas magique — la priorité reste l'alimentation réelle.</div><div class="p-ex-tag p-tag-f">Grade A</div></div>
        <div class="p-ex-row"><div class="p-ex-name">Caféine</div><div class="p-ex-detail">3–6 mg/kg (220–440 mg) 60 min avant séance. Améliore force, endurance et perception de l'effort (Grgic et al. 2020). 1–2 cafés suffisent souvent.</div><div class="p-ex-tag p-tag-c">Grade A</div></div>
        <div class="p-ex-row"><div class="p-ex-name">Bêta-alanine</div><div class="p-ex-detail">3,2–6,4 g/jour en doses fractionnées. Réduit la fatigue musculaire sur efforts 1–10 min (pertinent MetCon ATHX). Peut causer fourmillements bénins.</div><div class="p-ex-tag p-tag-m">Grade B</div></div>
        <div class="p-ex-row"><div class="p-ex-name">Vitamine D3</div><div class="p-ex-detail">1 000–2 000 UI/jour si exposition solaire faible (automne/hiver). Rôle dans la fonction musculaire et la récupération.</div><div class="p-ex-tag p-tag-r">Grade B</div></div>
      </div>
      <div class="p-warn">Les compléments non listés (BCAA, pré-workouts complexes, brûleurs, HMB…) n'ont pas de preuve suffisante à ce niveau pour justifier leur coût. Priorité : alimentation d'abord.</div>
    </div>
  </template>
</div>
